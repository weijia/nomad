name: Build Windows Nomad with UI

on:
  workflow_dispatch: # 允许在 GitHub 网页手动点击运行
  push:
    branches: [ main ] # 或者你正在工作的分支

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22' # 根据你仓库里的 .go-version 文件调整

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Yarn
        run: npm install -g yarn

      - name: Build UI
        working-directory: ./ui
        run: |
          yarn install --network-timeout 300000
          npm run build

      - name: Install Go Bindata tool
        run: go install github.com/go-bindata/go-bindata-assetfs/...@latest

      - name: Embed UI into Go code
        run: go-bindata-assetfs -pkg agent -prefix ui -modtime 1480000000 -tags ui -o command/agent/bindata_assetfs.go ./ui/dist/...

      - name: Build Nomad Binary
        run: go build -tags ui -o nomad.exe .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nomad-windows-ui
          path: nomad.exe
