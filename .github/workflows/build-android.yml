name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ".go-version"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install UI dependencies
        working-directory: ./ui
        run: pnpm install --frozen-lockfile

      - name: Build UI
        working-directory: ./ui
        run: pnpm build

      - name: Install Go Bindata tools
        run: |
          go install github.com/hashicorp/go-bindata/go-bindata@bf7910af899725e4938903fb32048c7c0b15f12e
          go install github.com/elazarl/go-bindata-assetfs/go-bindata-assetfs@234c15e7648ff35458026de92b34c637bae5e6f7

      - name: Embed UI into Go code
        run: go-bindata-assetfs -pkg agent -prefix ui -modtime 1480000000 -tags ui -o command/agent/bindata_assetfs.go ./ui/dist/...

      - name: Install Android NDK
        uses: android-actions/setup-android@v3

      - name: Cross-compile Nomad for Android ARM64
        run: |
          NDK_HOME=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | head -1)
          echo "Using NDK: $NDK_HOME"
          export CC="${NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang"
          export CXX="${NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang++"
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 \
            go build -trimpath \
            -ldflags "-X github.com/hashicorp/nomad/version.GitCommit=$(git rev-parse HEAD) -s -w -extldflags '-static'" \
            -tags "ui hashicorpmetrics" \
            -o nomad-android-arm64 .

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Android project
        run: |
          mkdir -p android/app/src/main/java/com/nomad/ui
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/assets/www
          mkdir -p android/app/src/main/jniLibs/arm64-v8a/bin

          # Copy built UI to assets
          cp -r ui/dist/* android/app/src/main/assets/www/

          # Copy Nomad binary into Android native libs dir
          cp nomad-android-arm64 android/app/src/main/jniLibs/arm64-v8a/libnomad.so

          # Generate signing key
          keytool -genkey -v -keystore android/app/keystore.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias nomad -storepass nomad123 -keypass nomad123 \
            -dname "CN=Nomad, OU=Dev, O=Nomad, L=SanFrancisco, ST=CA, C=US"

      - name: Create Android source files
        run: |
          cat > android/app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <application
                  android:allowBackup="true"
                  android:label="Nomad"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true"
                  android:extractNativeLibs="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:launchMode="singleTask">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".NomadService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse" />
              </application>
          </manifest>
          EOF

          cat > android/app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Nomad</string>
          </resources>
          EOF

          cat > android/app/src/main/res/values/styles.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="colorPrimary">#1A73E8</item>
                  <item name="colorPrimaryDark">#1557B0</item>
                  <item name="colorAccent">#1A73E8</item>
              </style>
          </resources>
          EOF

          cat > android/app/src/main/java/com/nomad/ui/NomadService.java << 'EOF'
          package com.nomad.ui;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Intent;
          import android.os.Build;
          import android.os.Environment;
          import android.os.IBinder;
          import android.util.Log;
          import java.io.File;
          import java.io.BufferedReader;
          import java.io.InputStreamReader;

          public class NomadService extends Service {
              private static final String TAG = "NomadService";
              private static final String CHANNEL_ID = "nomad_service";
              private Process nomadProcess;

              @Override
              public void onCreate() {
                  super.onCreate();
                  createNotificationChannel();
                  Notification notification = new Notification.Builder(this, CHANNEL_ID)
                      .setContentTitle("Nomad Agent")
                      .setContentText("Running")
                      .setSmallIcon(android.R.drawable.ic_menu_manage)
                      .build();
                  startForeground(1, notification);
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  startNomad();
                  return START_STICKY;
              }

              private void startNomad() {
                  new Thread(() -> {
                      try {
                          File nomadDir = new File(getFilesDir(), "nomad");
                          nomadDir.mkdirs();

                          String dataDir = nomadDir.getAbsolutePath() + "/data";
                          new File(dataDir).mkdirs();

                          String[] cmd = {
                              getApplicationInfo().nativeLibraryDir + "/libnomad.so",
                              "agent",
                              "-dev",
                              "-bind=0.0.0.0:4646",
                              "-data-dir=" + dataDir
                          };

                          Log.i(TAG, "Starting nomad: " + String.join(" ", cmd));
                          ProcessBuilder pb = new ProcessBuilder(cmd);
                          pb.environment().put("HOME", nomadDir.getAbsolutePath());
                          pb.redirectErrorStream(true);
                          nomadProcess = pb.start();

                          BufferedReader reader = new BufferedReader(
                              new InputStreamReader(nomadProcess.getInputStream()));
                          String line;
                          while ((line = reader.readLine()) != null) {
                              Log.i(TAG, "nomad: " + line);
                          }
                      } catch (Exception e) {
                          Log.e(TAG, "Failed to start nomad", e);
                      }
                  }).start();
              }

              private void createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel(
                          CHANNEL_ID, "Nomad Service", NotificationManager.IMPORTANCE_LOW);
                      NotificationManager manager = getSystemService(NotificationManager.class);
                      if (manager != null) manager.createNotificationChannel(channel);
                  }
              }

              @Override
              public void onDestroy() {
                  if (nomadProcess != null) nomadProcess.destroy();
                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) { return null; }
          }
          EOF

          cat > android/app/src/main/java/com/nomad/ui/MainActivity.java << 'EOF'
          package com.nomad.ui;

          import android.app.Activity;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.KeyEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              private static final String NOMAD_URL = "http://127.0.0.1:4646/ui/";
              private WebView webView;
              private Handler handler = new Handler(Looper.getMainLooper());
              private int retryCount = 0;
              private static final int MAX_RETRIES = 30;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setFlags(
                      WindowManager.LayoutParams.FLAG_FULLSCREEN,
                      WindowManager.LayoutParams.FLAG_FULLSCREEN);
                  if (getActionBar() != null) getActionBar().hide();

                  // Start Nomad agent service
                  Intent serviceIntent = new Intent(this, NomadService.class);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      startForegroundService(serviceIntent);
                  } else {
                      startService(serviceIntent);
                  }

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setDatabaseEnabled(true);
                  settings.setCacheMode(WebSettings.LOAD_DEFAULT);
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  settings.setUseWideViewPort(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setSupportZoom(false);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());
                  webView.setOverScrollMode(View.OVER_SCROLL_NEVER);

                  // Wait for Nomad agent to be ready, then load UI
                  waitForNomadAndLoad();
              }

              private void waitForNomadAndLoad() {
                  handler.postDelayed(() -> {
                      try {
                          java.net.URL url = new java.net.URL(NOMAD_URL);
                          java.net.HttpURLConnection conn = (java.net.HttpURLConnection) url.openConnection();
                          conn.setConnectTimeout(1000);
                          conn.setReadTimeout(1000);
                          conn.setRequestMethod("HEAD");
                          int response = conn.getResponseCode();
                          conn.disconnect();
                          if (response == 200 || response == 302 || response == 301) {
                              webView.loadUrl(NOMAD_URL);
                              retryCount = 0;
                          } else {
                              retry();
                          }
                      } catch (Exception e) {
                          retry();
                      }
                  }, 1000);
              }

              private void retry() {
                  retryCount++;
                  if (retryCount < MAX_RETRIES) {
                      waitForNomadAndLoad();
                  } else {
                      Toast.makeText(this, "Nomad agent failed to start", Toast.LENGTH_LONG).show();
                  }
              }

              @Override
              public boolean onKeyDown(int keyCode, KeyEvent event) {
                  if (keyCode == KeyEvent.KEYCODE_BACK && webView.canGoBack()) {
                      webView.goBack();
                      return true;
                  }
                  return super.onKeyDown(keyCode, event);
              }

              @Override
              protected void onResume() { super.onResume(); webView.onResume(); }

              @Override
              protected void onPause() { super.onPause(); webView.onPause(); }

              @Override
              protected void onDestroy() {
                  if (webView != null) webView.destroy();
                  super.onDestroy();
              }
          }
          EOF

          cat > android/settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          include ':app'
          EOF

          cat > android/build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.1.0' apply false
          }
          EOF

          cat > android/gradle.properties << 'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat > android/app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }

          repositories {
              google()
              mavenCentral()
          }

          android {
              namespace 'com.nomad.ui'
              compileSdk 34

              defaultConfig {
                  applicationId "com.nomad.ui"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
                  ndk {
                      abiFilters 'arm64-v8a'
                  }
              }

              signingConfigs {
                  release {
                      storeFile file("keystore.jks")
                      storePassword "nomad123"
                      keyAlias "nomad"
                      keyPassword "nomad123"
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              packagingOptions {
                  jniLibs {
                      useLegacyPackaging = true
                  }
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.webkit:webkit:1.8.0'
          }
          EOF

          touch android/app/proguard-rules.pro

      - name: Setup Gradle Wrapper
        working-directory: ./android
        run: |
          mkdir -p gradle/wrapper
          curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.0.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
          curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.0.0/gradlew -o gradlew
          curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.0.0/gradlew.bat -o gradlew.bat
          cat > gradle/wrapper/gradle-wrapper.properties << 'PROPS'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.0-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          PROPS
          chmod +x gradlew
          ./gradlew --version

      - name: Build Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Release APK
        working-directory: ./android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nomad-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: nomad-android-release
          path: android/app/build/outputs/apk/release/app-release.apk
