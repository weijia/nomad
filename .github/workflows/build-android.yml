name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ".go-version"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install UI dependencies
        working-directory: ./ui
        run: pnpm install --frozen-lockfile

      - name: Build UI
        working-directory: ./ui
        run: pnpm build

      - name: Install Go Bindata tools
        run: |
          go install github.com/hashicorp/go-bindata/go-bindata@bf7910af899725e4938903fb32048c7c0b15f12e
          go install github.com/elazarl/go-bindata-assetfs/go-bindata-assetfs@234c15e7648ff35458026de92b34c637bae5e6f7

      - name: Embed UI into Go code
        run: go-bindata-assetfs -pkg agent -prefix ui -modtime 1480000000 -tags ui -o command/agent/bindata_assetfs.go ./ui/dist/...

      - name: Install Android NDK
        uses: android-actions/setup-android@v3

      - name: Cross-compile Nomad for Android ARM64
        run: |
          NDK_HOME=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | head -1)
          echo "Using NDK: $NDK_HOME"
          NDK_SYSROOT="${NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          export CC="${NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang"
          export CXX="${NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang++"
          export CGO_LDFLAGS="-L${NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android -llog -lm -ldl -lc"
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 \
            go build -trimpath \
            -ldflags "-X github.com/hashicorp/nomad/version.GitCommit=$(git rev-parse HEAD) -s -w" \
            -tags "ui hashicorpmetrics" \
            -o nomad-android-arm64 .

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Android project
        run: |
          mkdir -p android/app/src/main/java/com/nomad/ui
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/assets/www
          mkdir -p android/app/src/main/jniLibs/arm64-v8a

          # Copy built UI to assets
          cp -r ui/dist/* android/app/src/main/assets/www/

          # Copy Nomad binary into jniLibs (nativeLibraryDir allows execution on Android 10+)
          cp nomad-android-arm64 android/app/src/main/jniLibs/arm64-v8a/libnomad.so

          # Generate signing key
          keytool -genkey -v -keystore android/app/keystore.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias nomad -storepass nomad123 -keypass nomad123 \
            -dname "CN=Nomad, OU=Dev, O=Nomad, L=SanFrancisco, ST=CA, C=US"

      - name: Create Android source files
        run: |
          cat > android/app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <application
                  android:allowBackup="true"
                  android:label="Nomad"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true"
                  android:extractNativeLibs="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:launchMode="singleTask">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".NomadService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse" />
              </application>
          </manifest>
          EOF

          cat > android/app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Nomad</string>
          </resources>
          EOF

          cat > android/app/src/main/res/values/styles.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="colorPrimary">#1A73E8</item>
                  <item name="colorPrimaryDark">#1557B0</item>
                  <item name="colorAccent">#1A73E8</item>
              </style>
          </resources>
          EOF

          cat > android/app/src/main/java/com/nomad/ui/LogCache.java << 'EOF'
          package com.nomad.ui;

          import java.util.ArrayList;
          import java.util.List;

          public class LogCache {
              private static final LogCache instance = new LogCache();
              private final List<String> logs = new ArrayList<>();
              private final List<LogListener> listeners = new ArrayList<>();
              private static final int MAX_LOGS = 2000;

              public interface LogListener {
                  void onLog(String line);
              }

              private LogCache() {}

              public static LogCache getInstance() { return instance; }

              public synchronized void addLog(String line) {
                  String timestamp = new java.text.SimpleDateFormat("HH:mm:ss.SSS", java.util.Locale.US)
                      .format(new java.util.Date());
                  String entry = "[" + timestamp + "] " + line;
                  logs.add(entry);
                  if (logs.size() > MAX_LOGS) {
                      logs.remove(0);
                  }
                  for (LogListener l : listeners) {
                      l.onLog(entry);
                  }
              }

              public synchronized List<String> getLogs() {
                  return new ArrayList<>(logs);
              }

              public synchronized void addListener(LogListener l) {
                  listeners.add(l);
              }

              public synchronized void removeListener(LogListener l) {
                  listeners.remove(l);
              }
          }
          EOF

          cat > android/app/src/main/java/com/nomad/ui/NomadService.java << 'EOF'
          package com.nomad.ui;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Intent;
          import android.os.Build;
          import android.os.IBinder;
          import android.util.Log;
          import java.io.File;
          import java.io.BufferedReader;
          import java.io.InputStreamReader;

          public class NomadService extends Service {
              private static final String TAG = "NomadService";
              private static final String CHANNEL_ID = "nomad_service";
              private Process nomadProcess;
              private boolean running = false;

              @Override
              public void onCreate() {
                  super.onCreate();
                  createNotificationChannel();
                  Notification notification = new Notification.Builder(this, CHANNEL_ID)
                      .setContentTitle("Nomad Agent")
                      .setContentText("Starting...")
                      .setSmallIcon(android.R.drawable.ic_menu_manage)
                      .build();
                  startForeground(1, notification);
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (!running) {
                      startNomad();
                  }
                  return START_STICKY;
              }

              private void startNomad() {
                  new Thread(() -> {
                      running = true;
                      try {
                          File nomadDir = new File(getFilesDir(), "nomad");
                          nomadDir.mkdirs();

                          String dataDir = nomadDir.getAbsolutePath() + "/data";
                          new File(dataDir).mkdirs();

                          // Use nativeLibraryDir which allows execution on Android 10+
                          String binPath = getApplicationInfo().nativeLibraryDir + "/libnomad.so";

                          LogCache.getInstance().addLog("=== Nomad Agent Starting ===");
                          LogCache.getInstance().addLog("Binary: " + binPath);
                          LogCache.getInstance().addLog("Data dir: " + dataDir);

                          File binFile = new File(binPath);
                          if (!binFile.exists()) {
                              LogCache.getInstance().addLog("ERROR: Binary not found at " + binPath);
                              running = false;
                              return;
                          }
                          LogCache.getInstance().addLog("Binary size: " + binFile.length() + " bytes");

                          // Use sh -c to execute (direct exec may fail on some devices)
                          // -server -client: start both server and client (no config needed)
                          String shellCmd = "exec " + binPath +
                              " agent" +
                              " -data-dir=" + dataDir;

                          String[] cmd = { "sh", "-c", shellCmd };

                          LogCache.getInstance().addLog("Command: " + shellCmd);
                          LogCache.getInstance().addLog("Working dir: " + nomadDir.getAbsolutePath());
                          LogCache.getInstance().addLog("Environment HOME: " + nomadDir.getAbsolutePath());
                          Log.i(TAG, "Starting nomad: " + shellCmd);

                          ProcessBuilder pb = new ProcessBuilder(cmd);
                          pb.directory(nomadDir);
                          pb.environment().put("HOME", nomadDir.getAbsolutePath());
                          pb.environment().put("NOMAD_LOG_LEVEL", "DEBUG");
                          pb.environment().put("NOMAD_LOG_JSON", "false");
                          pb.redirectErrorStream(true);
                          nomadProcess = pb.start();

                          LogCache.getInstance().addLog("Process started, PID: " + getPid(nomadProcess));

                          BufferedReader reader = new BufferedReader(
                              new InputStreamReader(nomadProcess.getInputStream()));
                          String line;
                          int lineCount = 0;
                          while ((line = reader.readLine()) != null) {
                              Log.i(TAG, "nomad: " + line);
                              LogCache.getInstance().addLog(line);
                              lineCount++;
                              // Update notification every 50 lines
                              if (lineCount % 50 == 0) {
                                  updateNotification("Nomad Agent - Running (" + lineCount + " lines)");
                              }
                          }

                          int exitCode = nomadProcess.waitFor();
                          LogCache.getInstance().addLog("=== Nomad exited with code: " + exitCode + " ===");
                          updateNotification("Nomad Agent - Exited (" + exitCode + ")");
                          running = false;
                      } catch (Exception e) {
                          Log.e(TAG, "Failed to start nomad", e);
                          LogCache.getInstance().addLog("ERROR: " + e.getMessage());
                          StringBuilder sb = new StringBuilder();
                          for (StackTraceElement ste : e.getStackTrace()) {
                              sb.append("  at ").append(ste.toString()).append("\n");
                          }
                          LogCache.getInstance().addLog(sb.toString());
                          running = false;
                      }
                  }).start();
              }

              private void updateNotification(String text) {
                  Notification notification = new Notification.Builder(this, CHANNEL_ID)
                      .setContentTitle("Nomad Agent")
                      .setContentText(text)
                      .setSmallIcon(android.R.drawable.ic_menu_manage)
                      .build();
                  NotificationManager manager = getSystemService(NotificationManager.class);
                  if (manager != null) manager.notify(1, notification);
              }

              private long getPid(Process p) {
                  try {
                      java.lang.reflect.Field pidField = p.getClass().getDeclaredField("pid");
                      pidField.setAccessible(true);
                      return pidField.getLong(p);
                  } catch (Exception e) {
                      return -1;
                  }
              }

              private void createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel(
                          CHANNEL_ID, "Nomad Service", NotificationManager.IMPORTANCE_LOW);
                      NotificationManager manager = getSystemService(NotificationManager.class);
                      if (manager != null) manager.createNotificationChannel(channel);
                  }
              }

              @Override
              public void onDestroy() {
                  if (nomadProcess != null) {
                      LogCache.getInstance().addLog("=== Stopping Nomad process ===");
                      nomadProcess.destroy();
                  }
                  running = false;
                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) { return null; }
          }
          EOF

          cat > android/app/src/main/java/com/nomad/ui/MainActivity.java << 'EOF'
          package com.nomad.ui;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Gravity;
          import android.view.KeyEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          public class MainActivity extends Activity {
              private static final String NOMAD_URL = "http://127.0.0.1:4646/ui/";
              private Handler handler = new Handler(Looper.getMainLooper());
              private int retryCount = 0;
              private static final int MAX_RETRIES = 60;

              private FrameLayout rootLayout;
              private ScrollView logScrollView;
              private TextView logTextView;
              private WebView webView;
              private LinearLayout toolbar;
              private Button toggleBtn;
              private boolean showingLogs = true;
              private boolean nomadReady = false;
              private LogCache.LogListener logListener;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setFlags(
                      WindowManager.LayoutParams.FLAG_FULLSCREEN,
                      WindowManager.LayoutParams.FLAG_FULLSCREEN);
                  if (getActionBar() != null) getActionBar().hide();

                  // Build UI
                  rootLayout = new FrameLayout(this);
                  createToolbar();
                  createLogPanel();
                  createWebView();

                  setContentView(rootLayout);

                  // Start Nomad agent service
                  Intent serviceIntent = new Intent(this, NomadService.class);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      startForegroundService(serviceIntent);
                  } else {
                      startService(serviceIntent);
                  }

                  // Listen for logs
                  logListener = line -> handler.post(() -> appendLog(line));
                  LogCache.getInstance().addListener(logListener);

                  // Start polling for Nomad readiness
                  waitForNomadAndLoad();
              }

              private void createToolbar() {
                  toolbar = new LinearLayout(this);
                  toolbar.setOrientation(LinearLayout.HORIZONTAL);
                  toolbar.setBackgroundColor(Color.parseColor("#1A73E8"));
                  toolbar.setPadding(8, 8, 8, 8);
                  toolbar.setGravity(Gravity.CENTER_VERTICAL);

                  toggleBtn = new Button(this);
                  toggleBtn.setText("Show Web UI");
                  toggleBtn.setTextColor(Color.WHITE);
                  toggleBtn.setBackgroundColor(Color.parseColor("#1557B0"));
                  toggleBtn.setOnClickListener(v -> toggleView());
                  LinearLayout.LayoutParams btnParams = new LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.WRAP_CONTENT,
                      LinearLayout.LayoutParams.WRAP_CONTENT);
                  toolbar.addView(toggleBtn, btnParams);

                  FrameLayout.LayoutParams params = new FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT,
                      FrameLayout.LayoutParams.WRAP_CONTENT);
                  rootLayout.addView(toolbar, params);
              }

              private void createLogPanel() {
                  logScrollView = new ScrollView(this);
                  logScrollView.setBackgroundColor(Color.parseColor("#1E1E1E"));

                  logTextView = new TextView(this);
                  logTextView.setTextColor(Color.parseColor("#00FF00"));
                  logTextView.setTypeface(Typeface.MONOSPACE, Typeface.NORMAL);
                  logTextView.setTextSize(10);
                  logTextView.setPadding(12, 12, 12, 12);
                  logTextView.setText("Waiting for Nomad agent to start...\n\n");

                  logScrollView.addView(logTextView);

                  FrameLayout.LayoutParams params = new FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT,
                      FrameLayout.LayoutParams.MATCH_PARENT);
                  params.topMargin = 60; // below toolbar
                  rootLayout.addView(logScrollView, params);
              }

              private void createWebView() {
                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.WHITE);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setDatabaseEnabled(true);
                  settings.setCacheMode(WebSettings.LOAD_DEFAULT);
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  settings.setUseWideViewPort(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setSupportZoom(false);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());
                  webView.setOverScrollMode(View.OVER_SCROLL_NEVER);

                  FrameLayout.LayoutParams params = new FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT,
                      FrameLayout.LayoutParams.MATCH_PARENT);
                  params.topMargin = 60;
                  rootLayout.addView(webView, params);

                  // Start hidden
                  webView.setVisibility(View.GONE);
              }

              private void toggleView() {
                  if (showingLogs) {
                      logScrollView.setVisibility(View.GONE);
                      webView.setVisibility(View.VISIBLE);
                      toggleBtn.setText("Show Logs");
                      showingLogs = false;
                  } else {
                      webView.setVisibility(View.GONE);
                      logScrollView.setVisibility(View.VISIBLE);
                      toggleBtn.setText("Show Web UI");
                      showingLogs = true;
                  }
              }

              private void appendLog(String line) {
                  if (logTextView != null) {
                      logTextView.append(line + "\n");
                      // Auto-scroll to bottom
                      logScrollView.post(() ->
                          logScrollView.fullScroll(ScrollView.FOCUS_DOWN));
                  }
              }

              private void waitForNomadAndLoad() {
                  handler.postDelayed(() -> {
                      try {
                          java.net.URL url = new java.net.URL(NOMAD_URL);
                          java.net.HttpURLConnection conn = (java.net.HttpURLConnection) url.openConnection();
                          conn.setConnectTimeout(500);
                          conn.setReadTimeout(500);
                          conn.setRequestMethod("HEAD");
                          int response = conn.getResponseCode();
                          conn.disconnect();
                          if (response == 200 || response == 302 || response == 301) {
                              if (!nomadReady) {
                                  nomadReady = true;
                                  LogCache.getInstance().addLog("=== Nomad UI is ready at " + NOMAD_URL + " ===");
                                  LogCache.getInstance().addLog("Tap 'Show Web UI' button to switch to the Nomad dashboard");
                                  // Auto-switch to WebView
                                  handler.postDelayed(() -> {
                                      if (showingLogs) toggleView();
                                  }, 1000);
                              }
                              retryCount = 0;
                              // Keep checking connectivity
                              scheduleNextCheck();
                          } else {
                              scheduleNextCheck();
                          }
                      } catch (Exception e) {
                          scheduleNextCheck();
                      }
                  }, 1000);
              }

              private void scheduleNextCheck() {
                  retryCount++;
                  if (retryCount < MAX_RETRIES) {
                      handler.postDelayed(this::waitForNomadAndLoad, 1000);
                  } else {
                      LogCache.getInstance().addLog("=== WARNING: Nomad agent did not start within 60 seconds ===");
                      LogCache.getInstance().addLog("Check the logs above for errors.");
                  }
              }

              @Override
              public boolean onKeyDown(int keyCode, KeyEvent event) {
                  if (keyCode == KeyEvent.KEYCODE_BACK) {
                      if (!showingLogs && webView.canGoBack()) {
                          webView.goBack();
                          return true;
                      }
                  }
                  return super.onKeyDown(keyCode, event);
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (webView != null) webView.onResume();
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  if (webView != null) webView.onPause();
              }

              @Override
              protected void onDestroy() {
                  if (logListener != null) {
                      LogCache.getInstance().removeListener(logListener);
                  }
                  if (webView != null) webView.destroy();
                  super.onDestroy();
              }
          }
          EOF

          cat > android/settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          include ':app'
          EOF

          cat > android/build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.1.0' apply false
          }
          EOF

          cat > android/gradle.properties << 'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat > android/app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }

          repositories {
              google()
              mavenCentral()
          }

          android {
              namespace 'com.nomad.ui'
              compileSdk 34

              defaultConfig {
                  applicationId "com.nomad.ui"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
                  ndk {
                      abiFilters 'arm64-v8a'
                  }
              }

              signingConfigs {
                  release {
                      storeFile file("keystore.jks")
                      storePassword "nomad123"
                      keyAlias "nomad"
                      keyPassword "nomad123"
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              packagingOptions {
                  jniLibs {
                      useLegacyPackaging = true
                  }
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.webkit:webkit:1.8.0'
          }
          EOF

          touch android/app/proguard-rules.pro

      - name: Setup Gradle Wrapper
        working-directory: ./android
        run: |
          mkdir -p gradle/wrapper
          curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.0.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
          curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.0.0/gradlew -o gradlew
          curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.0.0/gradlew.bat -o gradlew.bat
          cat > gradle/wrapper/gradle-wrapper.properties << 'PROPS'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.0-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          PROPS
          chmod +x gradlew
          ./gradlew --version

      - name: Build Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Release APK
        working-directory: ./android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nomad-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: nomad-android-release
          path: android/app/build/outputs/apk/release/app-release.apk
