name: Build Android CLI

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ".go-version"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install UI dependencies
        working-directory: ./ui
        run: pnpm install --frozen-lockfile

      - name: Build UI
        working-directory: ./ui
        run: pnpm build

      - name: Install Go Bindata tools
        run: |
          go install github.com/hashicorp/go-bindata/go-bindata@bf7910af899725e4938903fb32048c7c0b15f12e
          go install github.com/elazarl/go-bindata-assetfs/go-bindata-assetfs@234c15e7648ff35458026de92b34c637bae5e6f7

      - name: Embed UI into Go code
        run: go-bindata-assetfs -pkg agent -prefix ui -modtime 1480000000 -tags ui -o command/agent/bindata_assetfs.go ./ui/dist/...

      - name: Install Android NDK
        uses: android-actions/setup-android@v3

      - name: Build Nomad CLI for Android ARM64
        env:
          CGO_ENABLED: 1
          CC: ${{ github.workspace }}/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang
          GOOS: android
          GOARCH: arm64
        run: |
          NDK_HOME=$(echo $ANDROID_NDK_HOME)
          if [ -z "$NDK_HOME" ]; then
            NDK_HOME=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | head -1)
          fi
          echo "Using NDK: $NDK_HOME"
          export CC="${NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang"
          export CXX="${NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang++"
          go build -trimpath \
            -ldflags "-X github.com/hashicorp/nomad/version.GitCommit=$(git rev-parse HEAD) -extldflags '-lm'" \
            -tags "ui hashicorpmetrics" \
            -o nomad-android-arm64 .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nomad-android-arm64
          path: nomad-android-arm64
